<!DOCTYPE html>
<html>
<head>
  <title>WiFi Login Setup</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 15px;
      width: 250px;
      background-color: #f4f4f4;
    }

    h2 {
      margin-top: 0;
      font-size: 18px;
      color: #333;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      margin: 6px 0 12px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      background-color: #007bff;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #0056b3;
    }

    .status {
      margin-top: 10px;
      text-align: center;
      font-size: 13px;
      color: green;
      display: none;
    }
  </style>
</head>
<body>
  <h2>WiFi Auto Login</h2>
  <input type="text" id="username" placeholder="Enter Username" />
  <input type="password" id="password" placeholder="Enter Password" />
  <button id="save">💾 Save Credentials</button>
  <div class="status" id="status">Saved!</div>

  <script src="popup.js"></script>
</body>
</html>
