<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WiFi Login Setup</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      width: 280px;
      background: linear-gradient(145deg, #e6e9f0, #eef1f5);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      box-sizing: border-box;
    }

    h2 {
      font-size: 20px;
      color: #222;
      margin-bottom: 20px;
      text-align: center;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 15px;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      font-size: 14px;
      transition: border 0.3s ease;
      outline: none;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #007bff;
      box-shadow: 0 0 5px rgba(0, 123, 255, 0.2);
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(135deg, #007bff, #0056b3);
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background: linear-gradient(135deg, #0056b3, #003f8a);
      transform: scale(1.02);
    }

    .status {
      margin-top: 15px;
      padding: 8px;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: #2c662d;
      background-color: #d4edda;
      border: 1px solid #c3e6cb;
      border-radius: 6px;
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <h2>WiFi Auto Login</h2>
  <input type="text" id="username" placeholder="Enter Username" />
  <input type="password" id="password" placeholder="Enter Password" />
  <button id="save">Save Credentials</button>
  <div class="status" id="status">Credentials saved!</div>

  <script src="popup.js"></script>
</body>
</html>
